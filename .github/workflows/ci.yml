name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.toolchain }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.toolchain == 'nightly' }}
    strategy:
      matrix:
        toolchain: [stable, nightly]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          # The classifier's recognisers were written for the vendored corpus;
          # without it the tests that exercise them silently check nothing.
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.toolchain == 'stable' && matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  msrv:
    name: MSRV (1.87)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The classifier's recognisers were written for the vendored corpus;
          # without it the tests that exercise them silently check nothing.
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87"
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace

  tflite-loadable:
    name: TFLite loadability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the CLI
        run: cargo build --release -p nxpu-cli
      - name: Install a TFLite interpreter
        run: pip install --quiet ai-edge-litert
      # Asserting that a file begins with TFL3 is how models that no
      # interpreter could load stayed green for months. This loads them.
      - name: Load every emitted model
        run: tools/tflite-loadable.py

  license-audit:
    name: License Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The classifier's recognisers were written for the vendored corpus;
          # without it the tests that exercise them silently check nothing.
          submodules: recursive
      - uses: EmbarkStudios/cargo-deny-action@v2

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The classifier's recognisers were written for the vendored corpus;
          # without it the tests that exercise them silently check nothing.
          submodules: recursive
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
